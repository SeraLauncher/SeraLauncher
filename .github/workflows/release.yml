name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: resolve
        run: |
          pkg_ver="v$(jq -r .version package.json)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              tag="${{ github.ref_name }}"
            else
              tag="$pkg_ver"
            fi
            echo "Manual workflow dispatch for $tag"
          else
            tag="${{ github.ref_name }}"
            if [ "$tag" != "$pkg_ver" ]; then
              echo "Pushed tag $tag does not match package.json version $pkg_ver"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --title "$TAG" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache Bun dependency store
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Setup Go with automated go.mod / go.sum module & build cache
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile
          go mod tidy

      - name: Install NSIS for Windows installer
        if: matrix.name == 'Windows' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis

      - name: Install Linux WebKitGTK build dependencies
        if: matrix.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev

      # Cache precompiled MyGo CLI binary across runs
      - name: Cache MyGo CLI binary
        id: cache-mygo
        uses: actions/cache@v4
        with:
          path: ~/go/bin/mygo
          key: ${{ runner.os }}-${{ runner.arch }}-mygo-cli-v0.7.4

      - name: Install MyGo CLI
        if: steps.cache-mygo.outputs.cache-hit != 'true'
        run: go install github.com/egoist/mygo/cmd/mygo@v0.7.4

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Web Assets
        run: bun run build:web

      - name: Build and Upload Platform Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: mygo build -platform "${{ matrix.platform }}" -upload

  publish:
    needs: [draft-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.draft-release.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
