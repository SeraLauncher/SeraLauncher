name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Dependencies
        run: |
          bun install
          go mod tidy

      - name: Install System Build Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev nsis

      - name: Install MyGo CLI
        run: |
          go install github.com/egoist/mygo/cmd/mygo@v0.7.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Web Assets
        run: bun run build:web

      - name: Build Desktop & Upload Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          mygo build -upload
