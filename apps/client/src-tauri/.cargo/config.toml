# mold linker for faster dev builds; linux only because mold links
# elf binaries, windows/msvc and macos keep their default linkers
# https://tauri.app/develop/building-applications/#build-performance
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
